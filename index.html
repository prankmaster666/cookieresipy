<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIRUS.EXE</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Courier New",Consolas,monospace;color:#33ff66;cursor:crosshair}
  #matrix{position:fixed;inset:0;z-index:0;opacity:.3}
  .shake{animation:shake .35s infinite}
  @keyframes shake{
    0%{transform:translate(0,0)} 25%{transform:translate(-4px,2px)}
    50%{transform:translate(3px,-3px)} 75%{transform:translate(-2px,-1px)}
    100%{transform:translate(0,0)}
  }
  #glitch{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(0deg,rgba(0,255,120,.12) 0 2px,transparent 2px 4px)}
  #glitch.on{opacity:1}

  #terminal{position:fixed;top:16px;left:16px;width:min(440px,90vw);z-index:2;
    background:rgba(0,18,0,.82);border:1px solid #33ff66;padding:12px 14px;
    font-size:13px;line-height:1.5;box-shadow:0 0 18px rgba(51,255,102,.35)}
  #terminal h1{margin:0 0 8px;font-size:14px;letter-spacing:2px}
  #log{white-space:pre-wrap;min-height:120px}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .popup{position:absolute;width:290px;z-index:10;background:#0b0f0b;
    border:2px solid #33ff66;box-shadow:0 0 16px rgba(51,255,102,.5)}
  .popup .bar{display:flex;justify-content:space-between;align-items:center;
    background:#33ff66;color:#001500;padding:3px 6px;font-size:12px;font-weight:bold;
    cursor:move;user-select:none}
  .popup .bar .x{cursor:pointer;padding:0 4px}
  .popup .body{padding:10px;font-size:12px;line-height:1.45}
  .popup .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .popup button{font-family:inherit;font-size:12px;background:#001500;color:#33ff66;
    border:1px solid #33ff66;padding:3px 12px;cursor:pointer}
  .popup button:hover{background:#33ff66;color:#001500}

  #scan{position:fixed;bottom:0;left:0;right:0;z-index:3;background:rgba(0,18,0,.9);
    border-top:1px solid #33ff66;padding:8px 14px;font-size:12px;display:flex;
    gap:12px;align-items:center}
  #bar{flex:1;height:12px;border:1px solid #33ff66}
  #fill{height:100%;width:0;background:#33ff66;transition:width .3s}

  #bsod{position:fixed;inset:0;z-index:100;background:#0078d7;color:#fff;
    display:none;flex-direction:column;justify-content:center;padding:8vw;
    font-family:"Segoe UI",Arial,sans-serif}
  #bsod.on{display:flex}
  #bsod .face{font-size:80px;line-height:1}
  #bsod h2{font-weight:400;font-size:34px;margin:24px 0 8px}
  #bsod p{font-size:16px;opacity:.9;max-width:640px}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="glitch"></div>

<div id="terminal">
  <h1>&gt;_ VIRUS.EXE</h1>
  <div id="log"></div>
  <span class="cursor">█</span>
</div>

<div id="scan">
  <span>SCAN:</span>
  <div id="bar"><div id="fill"></div></div>
  <span id="pct">0%</span>
</div>

<div id="bsod">
  <div class="face">:(</div>
  <h2>Your PC ran into a problem.</h2>
  <p>We're collecting some error info, and then we'll restart for you.</p>
  <p id="bsodpct">0% complete</p>
</div>

<script>
/* ---------- sound ---------- */
let actx;
function beep(freq=440, dur=.07, type="square", vol=.03){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}

/* ---------- matrix rain ---------- */
const cv=document.getElementById("matrix"), cx=cv.getContext("2d");
let cols, drops;
function sizeMatrix(){
  cv.width=innerWidth; cv.height=innerHeight;
  cols=Math.floor(cv.width/16); drops=new Array(cols).fill(1);
}
sizeMatrix(); addEventListener("resize", sizeMatrix);
const glyphs="01アイウエオカキクケコサシスセソ#$%&";
setInterval(()=>{
  cx.fillStyle="rgba(0,0,0,.08)"; cx.fillRect(0,0,cv.width,cv.height);
  cx.fillStyle="#33ff66"; cx.font="14px monospace";
  drops.forEach((y,i)=>{
    cx.fillText(glyphs[Math.floor(Math.random()*glyphs.length)], i*16, y*16);
    drops[i]= y*16>cv.height && Math.random()>.975 ? 0 : y+1;
  });
}, 50);

/* ---------- boot log ---------- */
const lines=[
  "Booting VIRUS.EXE v6.66 ...",
  "Memory test: 640K OK (barely)",
  "Mounting C:\\ ... OK",
  "Loading kernel ... OK",
  "Checking for antivirus ...",
  "  > Antivirus NOT found. Good.",
  "Injecting payload into everything ...",
  "SYSTEM STATUS: INFECTED",
  "Enjoy your stay. :)"
];
const log=document.getElementById("log");
let li=0, ci=0;
(function type(){
  if(li>=lines.length) return;
  log.textContent += lines[li][ci] || "";
  if(Math.random()<.25) beep(1200+Math.random()*400,.02,"square",.015);
  if(ci < lines[li].length){ ci++; setTimeout(type, 18+Math.random()*40); }
  else { log.textContent += "\n"; li++; ci=0; setTimeout(type, 160); }
})();

/* ---------- popups ---------- */
const titles=["VIRUS.EXE","System Alert","ERROR","Warning","critical_stop","not_a_scam"];
const msgs=[
  "1,337 viruses detected on your PC!",
  "Your files are being encrypted. Probably.",
  "C:\\Windows\\System32 was deleted by accident.",
  "CPU temperature: 999°C",
  "RAM is leaking. Download more?",
  "Trojan.Win32.Fake.exe found.",
  "Someone is watching you through your webcam.",
  "Disk C: is 400% full.",
  "Your mouse is now self-aware.",
  "haha.exe has stopped responding.",
  "Task Manager has stopped responding. Twice.",
  "The cookie is a lie."
];
function shakeScreen(ms=900){
  document.body.classList.add("shake");
  clearTimeout(shakeScreen.t);
  shakeScreen.t=setTimeout(()=>document.body.classList.remove("shake"), ms);
}
function glitch(){
  const g=document.getElementById("glitch");
  g.classList.add("on");
  setTimeout(()=>g.classList.remove("on"), 120);
}
function spawnPopup(auto){
  const p=document.createElement("div");
  p.className="popup";
  const w=290, h=140;
  p.style.left = Math.random()*Math.max(10, innerWidth-w) + "px";
  p.style.top  = Math.random()*Math.max(10, innerHeight-h-50) + "px";
  p.innerHTML =
    '<div class="bar"><span>⚠ '+titles[Math.floor(Math.random()*titles.length)]+
    '</span><span class="x">✕</span></div>'+
    '<div class="body">'+msgs[Math.floor(Math.random()*msgs.length)]+
    '<div class="btns"><button class="ok">OK</button><button class="no">Cancel</button></div></div>';

  const bar=p.querySelector(".bar");
  let dx=0, dy=0, drag=false;
  bar.addEventListener("mousedown",e=>{drag=true; dx=e.clientX-p.offsetLeft; dy=e.clientY-p.offsetTop;});
  addEventListener("mousemove",e=>{ if(!drag) return; p.style.left=(e.clientX-dx)+"px"; p.style.top=(e.clientY-dy)+"px"; });
  addEventListener("mouseup",()=>drag=false);

  p.querySelector(".x").onclick = ()=>{ beep(300,.06); p.remove(); };
  p.querySelector(".no").onclick = ()=>{ beep(200,.1); glitch(); };
  p.querySelector(".ok").onclick = ()=>{
    beep(900,.06); p.remove();
    spawnPopup(); spawnPopup();   // the classic
  };

  document.body.appendChild(p);
  beep(auto?700:520,.05);
  shakeScreen(300);
}

/* auto-popup rampage */
setTimeout(()=>{ spawnPopup(true); }, 2600);
setInterval(()=>{
  if(document.querySelectorAll(".popup").length < 9) spawnPopup(true);
}, 2200);

/* ---------- fake scanner ---------- */
let pct=0;
setInterval(()=>{
  pct = (pct + Math.random()*7) % 101;
  document.getElementById("fill").style.width = pct+"%";
  document.getElementById("pct").textContent = Math.floor(pct)+"%";
}, 400);

/* ---------- BSOD ---------- */
function bsod(){
  beep(180,.6,"sawtooth",.05);
  document.getElementById("bsod").classList.add("on");
  let p=0;
  const t=setInterval(()=>{
    p+=Math.floor(Math.random()*12)+3;
    document.getElementById("bsodpct").textContent = Math.min(p,100)+"% complete";
    if(p>=100){ clearInterval(t); setTimeout(()=>document.getElementById("bsod").classList.remove("on"),900); }
  },220);
}
setTimeout(bsod, 22000);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") bsod(); });
document.addEventListener("click", ()=>actx && actx.resume(), {once:true});
</script>
</body>
</html>
